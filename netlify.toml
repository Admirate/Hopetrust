# Old WordPress page redirects → new Next.js routes
[[redirects]]
  from = "/counselling-psychologist"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/counselling-psychologist/"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/counselling-psychologist/*"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/counselling-psychologists"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/counselling-psychologists/"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/counselling-psychologists/*"
  to = "/book-your-session/"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us/*"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/what-do-we-treat/*"
  to = "/mental-health/"
  status = 301

[[redirects]]
  from = "/counselling-and-therapy/*"
  to = "/book-your-session/"
  status = 301

[[redirects]]
  from = "/how-the-hope-trust-program/*"
  to = "/about/"
  status = 301

# Serve the custom 404 page for unknown routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # PAYMENT DISABLED — restore Razorpay when integrated:
    # Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\")"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # CSP is in public/_headers (production only). Kept out of netlify.toml so netlify dev doesn't block Next.js eval() in dev mode.

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video files caching (important for hero video)
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Font files caching
[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image optimization (including logo)
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Handle favicon
[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000" 