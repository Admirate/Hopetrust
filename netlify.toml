[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "#custom"

# ─── Edge Functions ─────────────────────────────────────────────────────────
# Note: rate_limit is enforced per-function in code (see each .mjs file).
# Netlify platform-level rate limiting can be added via the Netlify dashboard.

[[edge_functions]]
  function = "submit-contact"
  path = "/api/submit-contact"

[[edge_functions]]
  function = "submit-newsletter"
  path = "/api/submit-newsletter"

[[edge_functions]]
  function = "submit-joinus"
  path = "/api/submit-joinus"

# ─── Redirects ───────────────────────────────────────────────────────────────

# Redirect old WordPress blog URLs (/blog/slug/) to new format (/blogs/slug/)
[[redirects]]
  from = "/blog/:slug"
  to = "/blogs/:slug/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/blogs/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blogs/"
  status = 301

# Handle client-side routing for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent caching of API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' https://*.supabase.co blob:; connect-src 'self' https://*.supabase.co https://prodcron.askadmissionsone.in; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video files caching (important for hero video)
[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Font files caching
[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image optimization (including logo)
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Handle favicon
[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000" 