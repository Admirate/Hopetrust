[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  autoLaunch = false

# Redirect old WordPress blog URLs (/blog/slug/) to new format (/blogs/slug/)
[[redirects]]
  from = "/blog/:slug"
  to = "/blogs/:slug/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/blogs/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blogs/"
  status = 301

# The chat bubble's proxy. The site is `output: 'export'`, so there is no Next
# API route to answer /api/chat — without this the request falls through to the
# catch-all 404 at the bottom of this file and the widget never reaches the CRM.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/whatsapp-crm"
  status = 200

# Admin API proxies (Netlify Functions)
[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin-programs"
  to = "/.netlify/functions/admin-programs"
  status = 200

